<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow the camera · Turn the page</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<body class="setup">
  <main class="setup-card">
    <img src="icons/icon48.png" alt="" width="40" height="40">
    <h1>Allow the camera once</h1>
    <p>Turn the page watches your hand through the webcam to turn Kindle pages. Chrome needs your OK the first time.</p>
    <p class="muted">The video stays on this computer. Nothing is recorded or uploaded, and the camera is only on while gestures are on.</p>
    <button id="allow" class="primary" type="button">Allow camera</button>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
